<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualización Tótem</title>

    <!-- 
        POLYFILL DE WEB SERIAL (sobre WebUSB)
        Se carga y se aplica ANTES que esp-web-tools, para que si el navegador
        (típicamente Chrome en Android) no soporta navigator.serial de forma nativa,
        quede "parcheado" con esta implementación basada en WebUSB.
        En Chrome de escritorio, donde navigator.serial ya existe de forma nativa,
        este bloque no hace nada (se respeta la implementación nativa).
    -->
    <script type="module">
        import { serial as polyfillSerial } from "https://cdn.jsdelivr.net/npm/web-serial-polyfill@1.0.15/+esm";

        const esAndroid = /Android/i.test(navigator.userAgent);

        // IMPORTANTE: en Chrome para Android, "navigator.serial" ya existe como
        // propiedad de solo lectura (tiene getter pero no setter, soporte parcial
        // nativo solo para Bluetooth RFCOMM). Por eso NO se puede hacer
        // "navigator.serial = polyfillSerial" directamente (lanza TypeError).
        // Hay que usar Object.defineProperty para redefinir la propiedad.
        function forzarPolyfill(motivo) {
            try {
                Object.defineProperty(navigator, 'serial', {
                    value: polyfillSerial,
                    configurable: true,
                    writable: true
                });
                console.log("[Polyfill] Aplicado correctamente. Motivo: " + motivo);
            } catch (err) {
                console.error("[Polyfill] No se pudo redefinir navigator.serial:", err);
            }
        }

        if (esAndroid) {
            forzarPolyfill("Android detectado, se fuerza WebUSB sobre el soporte parcial nativo.");
        } else if (!('serial' in navigator)) {
            forzarPolyfill("navigator.serial no disponible de forma nativa.");
        } else {
            console.log("[Polyfill] Escritorio con navigator.serial nativo. No se aplica el polyfill.");
        }
    </script>

    <!-- esp-web-tools se carga DESPUÉS del bloque anterior -->
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h1 { color: #0056b3; }
        p { color: #555; margin-bottom: 20px; }
        .aviso { font-size: 12px; color: #999; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Mantenimiento Tótem</h1>
        <p>Conecte el cable USB al ESP32 y pulse el botón para instalar o actualizar el firmware.</p>

        <esp-web-install-button manifest="manifest.json"></esp-web-install-button>

        <p class="aviso">Compatible con Chrome / Edge en Windows, macOS, Linux y Android.</p>
    </div>
</body>
</html>
